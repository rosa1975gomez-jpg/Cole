function latest(student,c){return data.ratings.filter(r=>r.student===student&&r.criterion===c&&activities().some(a=>a.id===r.activity)).sort((a,b)=>b.at.localeCompare(a.at))[0]}
const label=v=>v===2?'🟢 Conseguido':v===1?'🟡 En proceso':v===0?'🔴 Necesita mejorar':'— Sin evaluar';
function reportContent(student){return `<div class="card"><h2>${esc(cls()?.name||'')} · ${term}.º trimestre</h2><p>${activities().filter(a=>a.done).length} actividades realizadas · ${criteria().filter(c=>worked(c.id)).length} de ${criteria().length} criterios trabajados</p>${criteria().map(c=>`<div class="criterion"><b>${esc(c.area)} · ${esc(c.code)}</b><p>${esc(c.description)}</p><span class="pill ${worked(c.id)?'':'pending'}">${worked(c.id)?'Trabajado':'Pendiente'}</span></div>`).join('')}<div class="tablewrap"><table><thead><tr><th>Alumno/a</th>${criteria().map(c=>`<th>${esc(c.code)}</th>`).join('')}</tr></thead><tbody>${(cls()?.students||[]).filter(s=>!student||s.id===student).map(s=>`<tr><td>${esc(s.name)}</td>${criteria().map(c=>`<td>${label(latest(s.id,c.id)?.value)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h3 style="margin-top:25px">Registro de actividades y evidencias</h3>${activities().filter(a=>a.done).map(a=>`<div class="criterion"><b>${esc(a.name)}</b> · ${esc(a.date)}<p>${esc(a.comment)}</p><small>${(a.files||[]).map(f=>esc(f.name)).join(' · ')||'Sin archivos adjuntos'}</small></div>`).join('')||'<p>No hay actividades realizadas.</p>'}</div>`}
function drawReport(s){$('#reportContent').innerHTML=reportContent(s)}
function field(label,name,value='',type='text'){return `<label for="field-${name}">${label}</label><input id="field-${name}" type="${type}" name="${name}" value="${esc(value)}" required>`}
function area(label,name,value=''){return `<label for="field-${name}">${label}</label><textarea id="field-${name}" name="${name}">${esc(value)}</textarea>`}
function openForm(title,html,fn){$('#modalTitle').textContent=title;$('#fields').className='fields';$('#fields').innerHTML=html;$('#form').onsubmit=async e=>{e.preventDefault();const b=$('#form button[type=submit]');b.disabled=true;try{await fn(new FormData(e.target));await save();$('#modal').close();render();toast('Guardado correctamente')}catch(err){toast(err.message||'No se pudo guardar')}finally{b.disabled=false}};$('#modal').showModal()}
function needClass(){if(cls())return true;toast('Crea primero una clase.');classForm();return false}
function classForm(id){const c=data.classes.find(c=>c.id===id);openForm(c?'Editar clase':'Nueva clase',field('Nombre de la clase','name',c?.name||'')+field('Ciclo','cycle',c?.cycle||'Segundo ciclo'),f=>{if(c){c.name=f.get('name').trim();c.cycle=f.get('cycle').trim()}else{const id=uid();data.classes.push({id,name:f.get('name').trim(),cycle:f.get('cycle').trim(),students:[]});cid=id}})}
function studentForm(id){openForm('Añadir alumnos',area('Un nombre y apellidos por línea','names'),f=>{const names=f.get('names').split('\n').map(s=>s.trim()).filter(Boolean);if(!names.length)throw Error('Escribe al menos un nombre.');data.classes.find(c=>c.id===id).students.push(...names.map(name=>({id:uid(),name})))})}

function criterionForm(id){if(!needClass())return;const c=data.criteria.find(c=>c.id===id);openForm(c?'Editar criterio':'Añadir criterio',field('Área','area',c?.area||'Matemáticas')+field('Código del criterio','code',c?.code||'')+area('Descripción del criterio','description',c?.description||''),f=>{if(!f.get('description').trim())throw Error('Escribe la descripción.');const v={area:f.get('area').trim(),code:f.get('code').trim(),description:f.get('description').trim()};if(c)Object.assign(c,v);else data.criteria.push({id:uid(),classId:cid,term,...v})})}
function sequenceForm(id){if(!needClass())return;const s=data.sequences.find(x=>x.id===id);openForm(s?'Editar secuencia':'Nueva secuencia de aprendizaje',field('Título','name',s?.name||'')+area('Objetivo de aprendizaje','objective',s?.objective||'')+field('Áreas implicadas (separadas por comas)','areas',s?.areas||'Matemáticas, Lengua'),f=>{const v=Object.fromEntries(f);if(s)Object.assign(s,v);else data.sequences.push({id:uid(),classId:cid,term,...v})})}
function activityForm(id,sequence=''){if(!needClass())return;const a=data.activities.find(x=>x.id===id);openForm(a?'Actividad de robótica':'Nueva actividad',field('Título de la actividad','name',a?.name||'')+area('Breve descripción / reto motivador (opcional)','summary',a?.summary||'')+area('Objetivo de la actividad (opcional)','objective',a?.objective||'')+activityAreas(a?.areas||[])+`<details class="activity-details"><summary>Más detalles: instrucciones</summary>`+area('Descripción / instrucciones (opcional)','description',a?.description||'')+`</details>`+`<label>Secuencia de aprendizaje</label><select name="sequence"><option value="">Actividad independiente</option>${sequences().map(s=>`<option value="${s.id}" ${(a?.sequence||sequence)===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`+field('Orden dentro de la secuencia','order',a?.order||activities().length+1,'number')+`<label>Robot o herramienta</label><select name="tool">${['Codey Rocky · mBlock','LEGO SPIKE','Bee-Bot','mTiny','Robótica desenchufada','Otro'].map(t=>`<option ${a?.tool===t?'selected':''}>${t}</option>`).join('')}</select><label>Criterios asociados (puedes elegir varios)</label><div class="checks">${criteria().map(c=>`<label><input type="checkbox" name="criteria" value="${c.id}" ${a?.criteria.includes(c.id)?'checked':''}>${esc(c.area)} · ${esc(c.code)} — ${esc(c.description)}</label>`).join('')||'Todavía no hay criterios. Puedes crearlos aquí debajo.'}</div><div class="inline-criteria"><div class="sectionhead"><h3>Crea criterios para esta actividad</h3><button type="button" class="small" onclick="addActivityCriterion()">＋ Añadir criterio</button></div><p class="sub">Escribe el área, el código y el criterio. Se guardará y quedará asociado a esta actividad.</p><div id="activityNewCriteria"></div></div><div class="checks" style="margin-top:12px"><label><input type="checkbox" name="done" ${a?.done?'checked':''}>Actividad realizada</label></div><label>Fecha de realización</label><input name="date" type="date" value="${esc(a?.date||'')}">`+area('Comentario / evidencia','comment',a?.comment||'')+`<label>Añadir fotografías o documentos (máx. 10 MB por archivo)</label><input type="file" name="files" multiple><div class="evidence">${(a?.files||[]).map((f,i)=>`<a href="${esc(f.url)}" download="${esc(f.name)}">${f.type?.startsWith('image/')?`<img src="${esc(f.url)}" alt="">`: '📎'} ${esc(f.name)}</a><label><input type="checkbox" name="removeFile" value="${i}"> Quitar ${esc(f.name)}</label>`).join('')}</div>`,async f=>{if(f.has('done')&&!f.get('date'))throw Error('Indica la fecha de realización.');const newCriteria=readActivityCriteria();const files=(a?.files||[]).filter((_,i)=>!f.getAll('removeFile').includes(String(i)));for(const file of f.getAll('files')){if(!file.size)continue;if(file.size>10*1024*1024)throw Error('Cada archivo debe ocupar menos de 10 MB.');files.push({name:file.name,type:file.type,url:await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})})}const linkedCriteria=f.getAll('criteria');for(const draft of newCriteria){const existing=criteria().find(c=>c.area.toLocaleLowerCase()===draft.area.toLocaleLowerCase()&&c.code.toLocaleLowerCase()===draft.code.toLocaleLowerCase()&&c.description===draft.description);const c=existing||{id:uid(),classId:cid,term,...draft};if(!existing)data.criteria.push(c);if(!linkedCriteria.includes(c.id))linkedCriteria.push(c.id)}const v={name:f.get('name').trim(),description:f.get('description'),summary:f.get('summary').trim(),objective:f.get('objective').trim(),areas:f.getAll('activityAreas').concat(f.get('otherAreas').split(',').map(s=>s.trim()).filter(Boolean)),sequence:f.get('sequence'),order:Number(f.get('order')),tool:f.get('tool'),criteria:linkedCriteria,done:f.has('done'),date:f.get('date'),comment:f.get('comment'),files};if(a)Object.assign(a,v);else data.activities.push({id:uid(),classId:cid,term,...v})})}


const commonActivityAreas=['Ciencias de la Naturaleza','Ciencias Sociales','Matemáticas','Lengua Castellana y Literatura','Educación Artística','Educación Física','Lengua Extranjera'];
function activityAreas(selected){return `<label>Áreas implicadas (opcional)</label><div class="checks">${commonActivityAreas.map(name=>`<label><input type="checkbox" name="activityAreas" value="${esc(name)}" ${selected.includes(name)?'checked':''}>${esc(name)}</label>`).join('')}</div><label for="other-areas">Otras áreas (separadas por comas, opcional)</label><input id="other-areas" name="otherAreas" value="${esc(selected.filter(n=>!commonActivityAreas.includes(n)).join(', '))}">`}
function duplicateActivityForm(id){const a=data.activities.find(x=>x.id===id);openForm('Duplicar actividad',`<p class="sub">Se copiarán la planificación y los criterios. La copia empezará pendiente, sin fecha, evidencias ni evaluaciones.</p>`+field('Título de la copia','name',a.name+' (copia)')+`<label for="copy-class">Clase de destino</label><select id="copy-class" name="targetClass">${data.classes.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label for="copy-term">Trimestre de destino</label><select id="copy-term" name="targetTerm">${[1,2,3].map(t=>`<option value="${t}" ${t===term?'selected':''}>${t}.º trimestre</option>`).join('')}</select>`,f=>{const targetClass=f.get('targetClass'),targetTerm=Number(f.get('targetTerm'));copyActivity(a,targetClass,targetTerm,f.get('name').trim());cid=targetClass;term=targetTerm;page='sequences'})}
function copyActivity(a,targetClass,targetTerm,name){const ids=[];for(const id of a.criteria){const c=data.criteria.find(x=>x.id===id);if(!c)continue;let target=data.criteria.find(x=>x.classId===targetClass&&x.term===targetTerm&&x.area===c.area&&x.code===c.code&&x.description===c.description);if(!target){target={...c,id:uid(),classId:targetClass,term:targetTerm};data.criteria.push(target)}ids.push(target.id)}const copy={...structuredClone(a),id:uid(),name,classId:targetClass,term:targetTerm,criteria:ids,sequence:targetClass===a.classId&&targetTerm===a.term?a.sequence:'',order:data.activities.filter(x=>x.classId===targetClass&&x.term===targetTerm).length+1,done:false,date:'',comment:'',files:[]};data.activities.push(copy);return copy}

function addActivityCriterion(){const id=uid();const row=document.createElement('div');row.className='activity-criterion-row';row.innerHTML=`<div class="sectionhead"><b>Nuevo criterio</b><button type="button" class="small danger" onclick="this.closest('.activity-criterion-row').remove()">Quitar</button></div><label for="area-${id}">Área</label><input id="area-${id}" data-criterion="area" placeholder="Ej.: Ciencias de la Naturaleza" required><label for="code-${id}">Código del criterio</label><input id="code-${id}" data-criterion="code" placeholder="Ej.: 4.1" required><label for="description-${id}">Descripción del criterio</label><textarea id="description-${id}" data-criterion="description" placeholder="Escribe o pega el criterio que vas a evaluar" required></textarea>`;$('#activityNewCriteria').append(row);row.querySelector('input').focus()}
function readActivityCriteria(){return Array.from(document.querySelectorAll('.activity-criterion-row')).map(row=>{const value={};for(const key of ['area','code','description']){value[key]=row.querySelector('[data-criterion="'+key+'"]').value.trim();if(!value[key])throw Error('Completa el área, el código y la descripción de cada criterio nuevo, o quita la fila vacía.')}return value})}

function removeItem(type,id){if(!confirm('¿Eliminar este criterio? Se quitarán sus asociaciones y valoraciones.'))return;data[type]=data[type].filter(x=>x.id!==id);data.activities.forEach(a=>a.criteria=a.criteria.filter(c=>c!==id));data.ratings=data.ratings.filter(r=>r.criterion!==id);save();render()}
function rate(student,value){data.ratings=data.ratings.filter(r=>!(r.activity===activeActivity&&r.student===student&&r.criterion===activeCriterion));if(value>=0)data.ratings.push({activity:activeActivity,student,criterion:activeCriterion,value,at:new Date().toISOString()});save();render()}
function backup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Robotica-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Copia exportada con datos y evidencias')}
function validate(d){if(d?.version!==1||typeof d.year!=='string')return false;for(const k of ['classes','criteria','sequences','activities','ratings'])if(!Array.isArray(d[k]))return false;return d.classes.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.students)&&c.students.every(s=>typeof s.id==='string'&&typeof s.name==='string'))&&d.criteria.every(c=>typeof c.id==='string'&&typeof c.description==='string'&&typeof c.code==='string'&&typeof c.area==='string')&&d.sequences.every(s=>typeof s.id==='string'&&typeof s.name==='string')&&d.activities.every(a=>typeof a.id==='string'&&typeof a.name==='string'&&typeof a.tool==='string'&&Array.isArray(a.criteria)&&Array.isArray(a.files)&&a.files.every(f=>typeof f.name==='string'&&typeof f.url==='string'&&/^data:[^,]*;base64,/.test(f.url)))&&d.ratings.every(r=>[0,1,2].includes(r.value)&&typeof r.at==='string')}
$('#restore').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const d=JSON.parse(await file.text());if(!validate(d))throw Error('La copia no tiene un formato válido de Robótica.');if(!confirm('Importar sustituirá el cuaderno actual. Exporta primero una copia si quieres conservarlo. ¿Continuar?'))return;await write(d);data=d;cid='';render();toast('Cuaderno restaurado')}catch(e){toast(e.message)}finally{$('#restore').value=''}};
function demo(){if(data.classes.length)return;const id=uid(),s1=uid(),c1=uid(),c2=uid(),seq=uid();data.classes.push({id,name:'3.º B · Ejemplo',cycle:'Segundo ciclo',students:['Alumno de ejemplo 1','Alumno de ejemplo 2','Alumno de ejemplo 3'].map(name=>({id:uid(),name}))});cid=id;data.criteria.push({id:c1,classId:id,term:1,area:'Matemáticas',code:'4.1',description:'Resolver un reto sencillo siguiendo una secuencia de instrucciones.'},{id:c2,classId:id,term:1,area:'Lengua',code:'10.2',description:'Escuchar al equipo y llegar a acuerdos de forma dialogada.'});data.sequences.push({id:seq,classId:id,term:1,name:'Codey Rocky viaja a Italia',objective:'Planificar, programar y comprobar una ruta cooperativa.',areas:'Matemáticas, Lengua'});data.activities.push({id:uid(),classId:id,term:1,sequence:seq,name:'Próxima parada: Roma',description:'Planificar una ruta y programar los desplazamientos por equipos.',tool:'Codey Rocky · mBlock',order:1,criteria:[c1,c2],done:false,date:'',comment:'',files:[]});save();render()}
$('#classPick').onchange=e=>{cid=e.target.value;render()};$('#term').onchange=e=>{term=Number(e.target.value);render()};$('#year').onchange=e=>{data.year=e.target.value.trim();save()};
(async()=>{try{db=await new Promise((res,rej)=>{const r=indexedDB.open('cody-notebook',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});data=await new Promise((res,rej)=>{const r=db.transaction('state').objectStore('state').get('data');r.onsuccess=()=>res(r.result||blank());r.onerror=()=>rej(r.error)});render()}catch(e){$('#view').innerHTML=empty('No se puede abrir el almacenamiento del navegador. Comprueba sus permisos para guardar datos.')}})();
</script></body></html>
